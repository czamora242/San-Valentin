<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación a San Valentín</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>¡Feliz Día de San Valentín! <span class="heart">❤️</span></h1>
        <p>Mi amor</p>
        <p>Este 14 de febrero quiero hacer algo especial contigo. Elige tu plan perfecto:</p>
        <div class="options">
            <button id="cena">Cena Romántica</button>
            <button id="cine">Noche de Cine</button>
        </div>
        <p>Y para recordar nuestros momentos inolvidables, aquí van algunas fotos nuestras:</p>
        <div class="gallery" id="gallery">
            <img src="https://via.placeholder.com/300x200?text=Foto+1" alt="Foto 1">
            <img src="https://via.placeholder.com/300x200?text=Foto+2" alt="Foto 2">
            <img src="https://via.placeholder.com/300x200?text=Foto+3" alt="Foto 3">
            <img src="https://via.placeholder.com/300x200?text=Foto+4" alt="Foto 4">
        </div>
        <div class="confirmation" id="confirmation"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
