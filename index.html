<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación a San Valentín</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>¡Feliz Día de San Valentín! <span class="heart">❤️</span></h1>
        <p>Mi amor</p>
        <p>Este 14 de febrero quiero hacer algo especial contigo. Elige tu plan perfecto:</p>
        <div class="options">
            <button id="cena">Cena Romántica</button>
            <button id="cine">Noche de Cine</button>
        </div>
        <p>Y para recordar nuestros momentos inolvidables, aquí van algunas fotos nuestras:</p>
        <div class="gallery" id="gallery">
            <img src="foto4.jpeg" alt="Foto 1">
            <img src="foto6.jpeg" alt="Foto 2">
            <img src="foto3.jpeg" alt="Foto 3">
            <img src="foto5.jpeg" alt="Foto 4">
        </div>
    </div>

    <!-- Modal para elegir -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <div id="input-container"></div>
            <button id="confirm-btn">Confirmar ❤️</button>
        </div>
    </div>

    <!-- Modal de confirmación final -->
    <div class="modal" id="confirmation-modal">
        <div class="modal-content">
            <span class="close-confirmation">&times;</span>
            <h2>¡Confirmado! 💕</h2>
            <p id="final-message"></p>
        </div>
    </div>

    <!-- Firebase SDK v9+ (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlgGKK66P7SpO20vSQmpx4WSaDsMgKrrw",
            authDomain: "base-b5e59.firebaseapp.com",
            projectId: "base-b5e59",
            storageBucket: "base-b5e59.firebasestorage.app",
            messagingSenderId: "181651691084",
            appId: "1:181651691084:web:8f8e77b4f9cd96196d86e9",
            measurementId: "G-3554175VJ0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        console.log('✅ Firebase inicializado');

        // Exportar funciones globalmente
        window.firebaseDB = db;
        window.firebaseCollection = collection;
        window.firebaseAddDoc = addDoc;
        window.firebaseServerTimestamp = serverTimestamp;
        window.firebaseGetDocs = getDocs;
        window.firebaseOrderBy = orderBy;
        window.firebaseQuery = query;
        window.firebaseReady = true;
    </script>
    
    <!-- Script principal -->
    <script>
        // Esperar a que Firebase esté listo
        const esperarFirebase = setInterval(() => {
            if (window.firebaseReady) {
                clearInterval(esperarFirebase);
                console.log('✅ Todo listo para usar');
                iniciarApp();
            }
        }, 100);

        function iniciarApp() {
            const modal = document.getElementById('modal');
            const confirmationModal = document.getElementById('confirmation-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
            const inputContainer = document.getElementById('input-container');
            const confirmBtn = document.getElementById('confirm-btn');
            const finalMessage = document.getElementById('final-message');
            const closeBtn = document.querySelector('.close');
            const closeConfirmationBtn = document.querySelector('.close-confirmation');

            let selectedOption = '';

            // Botón Cena
            document.getElementById('cena').addEventListener('click', function() {
                console.log('Click en cena');}
                selectedOption = 'cena';
                gallery.style.display = 'block';
                modalTitle.textContent = '🍷 ¡Cena Romántica! 🍷';
                modalMessage.textContent = '¡Perfecto! ¿Dónde te gustaría cenar?';
                
                inputContainer.innerHTML = `
                    <label for="lugar-cena">Elige el restaurante:</label>
                    <input type="text" id="lugar-cena" placeholder="Ej: La Trattoria, Casa Morales, etc." />
                `;
                
                confirmationModal.style.display = 'none';
                modal.style.display = 'block';
            });

            // Botón Cine
            document.getElementById('cine').addEventListener('click', function() {
                console.log('Click en cine');
                selectedOption = 'cine';
                gallery.style.display = 'block';
                modalTitle.textContent = '🎬 ¡Noche de Cine! 🎬';
                modalMessage.textContent = '¡Genial! ¿Qué película te gustaría ver?';
                
                inputContainer.innerHTML = `
                    <label for="pelicula">Elige tu película favorita:</label>
                    <input type="text" id="pelicula" placeholder="Ej: Titanic, Notebook, La La Land, etc." />
                `;
                
                confirmationModal.style.display = 'none';
                modal.style.display = 'block';
            });

            // Botón Confirmar
            confirmBtn.addEventListener('click', async function() {
                console.log('Click en confirmar');
                console.log('Opción seleccionada:', selectedOption);

                const fecha = new Date();
                const fechaFormateada = fecha.toLocaleDateString('es-ES', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                let datosReserva = {};
                
                if (selectedOption === 'cena') {
                    const lugar = document.getElementById('lugar-cena').value;
                    console.log('Lugar ingresado:', lugar);
                    
                    if (lugar.trim() === '') {
                        alert('Por favor, ingresa el lugar donde quieres cenar ❤️');
                        return;
                    }
                    
                    finalMessage.textContent = `¡Perfecto mi amor! Nos vemos en ${lugar} para una cena romántica inolvidable. ¡Será mágico! 🍷✨`;
                    
                    datosReserva = {
                        tipo: 'Cena Romántica',
                        lugar: lugar,
                        fecha: fechaFormateada,
                        timestamp: window.firebaseServerTimestamp(),
                        mensaje: 'Será una velada mágica con velas, tu comida favorita y mucho amor.'
                    };
                    
                } else if (selectedOption === 'cine') {
                    const pelicula = document.getElementById('pelicula').value;
                    console.log('Película ingresada:', pelicula);
                    
                    if (pelicula.trim() === '') {
                        alert('Por favor, ingresa la película que quieres ver ❤️');
                        return;
                    }
                    
                    finalMessage.textContent = `¡Excelente elección! Prepararé todo para ver "${pelicula}" con palomitas y mucho amor. ¡Será una noche perfecta! 🎬🍿`;
                    
                    datosReserva = {
                        tipo: 'Noche de Cine',
                        pelicula: pelicula,
                        fecha: fechaFormateada,
                        timestamp: window.firebaseServerTimestamp(),
                        mensaje: 'Una noche perfecta acurrucados juntos con palomitas, mantas y mucho amor.'
                    };
                }
                
                console.log('Datos a guardar:', datosReserva);
                
                // Cambiar botón a estado de carga
                confirmBtn.textContent = 'Guardando... ⏳';
                confirmBtn.disabled = true;
                
                try {
                    const docRef = await window.firebaseAddDoc(
                        window.firebaseCollection(window.firebaseDB, 'planes_san_valentin'), 
                        datosReserva
                    );
                    
                    console.log('════════════════════════════════════════');
                    console.log('✅ ¡GUARDADO EXITOSO!');
                    console.log('ID del documento:', docRef.id);
                    console.log('Datos:', datosReserva);
                    console.log('════════════════════════════════════════');
                    
                    // Guardar también en localStorage
                    localStorage.setItem('planSanValentin', JSON.stringify(datosReserva));
                    
                    // Cerrar modal y mostrar confirmación
                    modal.style.display = 'none';
                    confirmationModal.style.display = 'block';
                    
                } catch (error) {
                    console.error('════════════════════════════════════════');
                    console.error('❌ ERROR AL GUARDAR');
                    console.error('Error completo:', error);
                    console.error('Código:', error.code);
                    console.error('Mensaje:', error.message);
                    console.error('════════════════════════════════════════');
                    
                    alert('Error al guardar: ' + error.message);
                } finally {
                    // Restaurar botón
                    confirmBtn.textContent = 'Confirmar ❤️';
                    confirmBtn.disabled = false;
                }
            });

            // Cerrar modales
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    modal.style.display = 'none';
                });
            }

            if (closeConfirmationBtn) {
                closeConfirmationBtn.addEventListener('click', function() {
                    confirmationModal.style.display = 'none';
                });
            }

            window.addEventListener('click', function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
                if (event.target === confirmationModal) {
                    confirmationModal.style.display = 'none';
                }
            });

            // Función para ver planes guardados
            window.verTodosLosPlanesGuardados = async function() {
                try {
                    const q = window.firebaseQuery(
                        window.firebaseCollection(window.firebaseDB, 'planes_san_valentin'), 
                        window.firebaseOrderBy('timestamp', 'desc')
                    );
                    const querySnapshot = await window.firebaseGetDocs(q);
                    
                    console.log('════════════════════════════════════════');
                    console.log(`📋 TOTAL: ${querySnapshot.size} planes`);
                    console.log('════════════════════════════════════════');
                    
                    querySnapshot.forEach((doc) => {
                        console.log(`ID: ${doc.id}`);
                        console.log(doc.data());
                        console.log('---');
                    });
                } catch (error) {
                    console.error('Error:', error);
                }
            };

            console.log('💡 Escribe en la consola: verTodosLosPlanesGuardados()');
        }
    </script>
</body>
</html>
