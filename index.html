<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación a San Valentín</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>¡Feliz Día de San Valentín! <span class="heart">❤️</span></h1>
        <p>Mi amor</p>
        <p>Este 14 de febrero quiero hacer algo especial contigo. Elige tu plan perfecto:</p>
        <div class="options">
            <button id="cena">Cena Romántica</button>
            <button id="cine">Noche de Cine</button>
        </div>
        <p>Y para recordar nuestros momentos inolvidables, aquí van algunas fotos nuestras:</p>
        <div class="gallery" id="gallery">
            <img src="foto4.jpeg" alt="Foto 1">
            <img src="foto6.jpeg" alt="Foto 2">
            <img src="foto3.jpeg" alt="Foto 3">
            <img src="foto5.jpeg" alt="Foto 4">
        </div>
    </div>

    <!-- Modal para elegir -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <div id="input-container"></div>
            <button id="confirm-btn">Confirmar ❤️</button>
        </div>
    </div>

    <!-- Modal de confirmación final -->
    <div class="modal" id="confirmation-modal">
        <div class="modal-content">
            <span class="close-confirmation">&times;</span>
            <h2>¡Confirmado! 💕</h2>
            <p id="final-message"></p>
        </div>
    </div>

    <!-- Firebase SDK con módulos ES6 -->
    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAlgGKK66P7SpO20vSQmpx4WSaDsMgKrrw",
            authDomain: "base-b5e59.firebaseapp.com",
            projectId: "base-b5e59",
            storageBucket: "base-b5e59.firebasestorage.app",
            messagingSenderId: "181651691084",
            appId: "1:181651691084:web:8f8e77b4f9cd96196d86e9",
            measurementId: "G-3554175VJ0"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Hacer disponibles las funciones globalmente
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.serverTimestamp = serverTimestamp;
        window.getDocs = getDocs;
        window.orderBy = orderBy;
        window.query = query;

        console.log('✅ Firebase inicializado correctamente');
    </script>
    
    <script src="script.js"></script>
</body>
</html>
